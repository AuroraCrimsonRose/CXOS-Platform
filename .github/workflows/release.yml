# Release: binaries ship as release assets, never as commits
# (docs/planning/HARDENING_PLAN.md, D7).
#
# Push a tag like v0.6.0, or run it by hand, and this publishes `cxk` and
# CXEX Studio for each platform and attaches them to a GitHub Release.
#
# The OS disk image (and later the ISO) joins this workflow with D5: it needs
# a toolchain the runner can install (clang, ld.lld, NASM, Ninja). It ships
# signed by a key generated for that one build and destroyed with the runner,
# so it verifies itself without claiming to be signed by the platform. An image
# signed by the PLATFORM key still waits on the plan's §5.
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        rid: [ win-x64, linux-x64, osx-arm64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish cxk (single file)
        run: >
          dotnet publish devkit/CXEX.CLI -c Release -r ${{ matrix.rid }}
          -p:SelfContained=true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o out/cli

      - name: Publish CXEX Studio
        run: >
          dotnet publish devkit/CXEX.Studio -c Release -r ${{ matrix.rid }}
          --self-contained -p:DebugType=none -o out/studio

      - name: Package
        run: |
          mkdir -p assets
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp out/cli/cxk.exe "assets/cxk-${{ matrix.rid }}.exe"
          else
            cp out/cli/cxk "assets/cxk-${{ matrix.rid }}"
          fi
          (cd out/studio && zip -qr "../../assets/CXEX-Studio-${{ matrix.rid }}.zip" .)
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: assets/*
          if-no-files-found: error

  # The OS disk image. This is the job D5 unblocked: the whole toolchain is now
  # installable with apt, so a clean runner can build CXK from source.
  #
  # It doubles as the only continuous check that D5's claim of "one toolchain on
  # every host" is true. Everything so far has been built on Windows; if clang,
  # ld.lld, NASM or Ninja behave differently here, this is where it shows.
  #
  # The image is UNSIGNED. Signing it needs the platform private key at build
  # time, and whether that key belongs in a CI secret is still open
  # (HARDENING_PLAN §5). Until it is settled this ships what can honestly be
  # built without the key, named so nobody mistakes it for a release artifact.
  image:
    name: OS disk image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install the toolchain (D5)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld nasm ninja-build cmake
          echo "--- versions ---"
          clang --version | head -1
          ld.lld --version
          nasm -v
          ninja --version
          cmake --version | head -1

      - name: Publish cxk
        run: >
          dotnet publish devkit/CXEX.CLI -c Release -r linux-x64
          -p:SelfContained=true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o out/cli

      # An EPHEMERAL key, generated here and destroyed with the runner.
      #
      # Without one this job built an image that cannot work: no signing key in
      # the repository means SIGN=OFF, and SIGN=OFF without --dev is a RELEASE
      # kernel - one that requires valid signatures - packaged with a userland
      # that has none. It booted, passed its self-tests and then refused its own
      # executive, which is what CMake's "the kernel WILL REFUSE to launch it"
      # warning was saying all along. A download that stops after the self-tests
      # reads as a broken release.
      #
      # Signing with a throwaway key fixes that without touching the §5 decision,
      # which is about the PLATFORM key and official images. The private half
      # never leaves the runner, so this image is a self-contained demonstration
      # and the key behind it can sign nothing for anyone else's machine. The
      # build generates the kernel's root of trust from the public half, so the
      # image trusts exactly the key that signed it.
      - name: Build the OS, signed with a per-build key
        run: |
          chmod +x out/cli/cxk
          out/cli/cxk keygen tools/ci
          out/cli/cxk os build --root . --key ci

      - name: Package
        run: |
          mkdir -p assets
          # The image is the CXOS release, so it is named like one: version and
          # the generation's name, both read from the registry rather than typed
          # here. jq is on the runner; a missing field fails the job instead of
          # producing an asset with a hole in its name.
          V=$(jq -er '.components.cxos.version' versions.json)
          N=$(jq -er '.components.cxos.release_name' versions.json | tr '[:upper:]' '[:lower:]')
          cp dist/CXK_x86_32/images/cxk_disk.img "assets/cxos-$V-$N-selfsigned.img"
          # Belt and braces: the key must not reach an artifact. It is gitignored
          # and never copied, and this makes a mistake here fail the job instead
          # of publishing a private key.
          rm -f tools/ci.xksk
          test ! -e assets/ci.xksk
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: assets/*
          if-no-files-found: error

  release:
    name: Release
    needs: [ publish, image ]
    runs-on: ubuntu-latest
    steps:
      # Checked out only for versions.json: this job otherwise handles artifacts,
      # but the release's own title comes from the registry like everything else.
      - uses: actions/checkout@v4

      - name: Read the release name from the registry
        id: reg
        run: |
          echo "name=$(jq -er '.components.cxos.release_name' versions.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # The semver identifies the release; the Greek name identifies what the
          # major generation means. It names the CXOS release only - never the
          # kernel, the boot chain or the tooling.
          name: ${{ github.event.inputs.tag || github.ref_name }} "${{ steps.reg.outputs.name }}"
          generate_release_notes: true
          files: assets/*
          # What each asset is, so nothing has to be guessed from its filename.
          # The generated commit notes are appended below this.
          body: |
            ### Assets

            | | |
            |---|---|
            | `cxk-win-x64.exe`, `cxk-linux-x64`, `cxk-osx-arm64` | the `cxk` CLI: the X compiler, the imager, signing, `cxk os build`, `cxk run`. Single file, no .NET install needed. |
            | `CXEX-Studio-<platform>.zip` | CXEX Studio. |
            | `cxos-1.0.0-hekate-selfsigned.img` | a bootable 64 MB CXK disk image, x86-32. |
            | `SHA256SUMS` | checksums for everything above. |

            Run the image with `cxk run cxos-1.0.0-hekate-selfsigned.img` (QEMU), or write
            it to a disk. It boots the kernel, runs the boot-time self-tests,
            and comes up to a shell with the executive and the supervisor
            running.

            ### About the image's signatures

            Every artifact in it — kernel, executive, services, programs — is
            signed, and the kernel's root of trust is the public half of the key
            that signed them. **That key is generated during the build and
            destroyed with the runner.** So the image is internally consistent
            and fully verifies itself, but it is *not* signed by the CXOS
            platform key: it demonstrates the signed path rather than attesting
            to anything. Treat it as a test image. Official images signed by the
            platform key wait on the release-signing decision in
            `docs/planning/HARDENING_PLAN.md` §5.

            Not a development kernel: it does **not** run unsigned code.
